<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple HTML with External CSS</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <h1>Welcome to My Website</h1>
    <p>A simple example using HTML and an external stylesheet.</p>
  </header>

  <main class="content">
    <section class="card">
      <h2>About This Page</h2>
      <p>
        This page uses standard HTML structure. Its appearance is defined separately
        in <code>styles.css</code>, linked from the document's head.
      </p>
      <a class="button" href="#about">Learn More</a>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 My Website</p>
  </footer>
</body>
</html>
