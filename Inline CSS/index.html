<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Basic HTML with Inline CSS</title>
</head>
<body style="margin: 0; font-family: Arial, sans-serif; background: linear-gradient(135deg, #f4f7fb, #dfeaf7); color: #222;">
  <header style="background: #1f3a5f; color: #fff; padding: 20px 40px; text-align: center;">
    <h1 style="margin: 0; font-size: 2.2rem;">Welcome</h1>
  </header>

  <main style="max-width: 900px; margin: 40px auto; padding: 0 20px;">
    <section style="background: #fff; border-radius: 12px; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08); padding: 30px;">
      <h2 style="color: #1f3a5f; margin-top: 0;">Basic HTML Page</h2>
      <p style="font-size: 1.05rem; line-height: 1.7;">
        This is a simple webpage created using HTML with inline CSS styling. Inline CSS is applied directly inside the HTML elements using the <strong>style</strong> attribute.
      </p>

      <button style="background: #2e7d32; color: #fff; border: none; padding: 12px 22px; border-radius: 8px; font-size: 1rem; cursor: pointer; margin-top: 10px;">
        Get Started
      </button>
    </section>
  </main>
</body>
</html>
