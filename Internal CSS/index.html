<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Internal CSS Example</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eef5ff, #dfe9f5);
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: 60px auto;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      padding: 30px;
    }

    h1 {
      text-align: center;
      color: #1d3557;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.05rem;
      line-height: 1.8;
      color: #333;
    }

    .button {
      display: inline-block;
      background: #2a9d8f;
      color: #fff;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 10px;
    }

    .button:hover {
      background: #21867a;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Internal CSS Example</h1>
    <p>
      This page uses internal CSS placed inside the <strong>&lt;style&gt;</strong> tag in the document head.
      Internal CSS is useful when you want to style a single HTML page without creating a separate CSS file.
    </p>
    <a href="#" class="button">Learn More</a>
  </div>
</body>
</html>
